name: Build Yattee tvOS Sideload

on:
  workflow_dispatch:
  schedule:
    # Once a day, 10:17 UTC
    - cron: "17 10 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}
      tag: ${{ steps.upstream.outputs.tag }}
      needs_build: ${{ steps.check_release.outputs.needs_build }}

    steps:
      - name: Get latest upstream commit
        id: upstream
        run: |
          SHA="$(git ls-remote https://github.com/yattee/yattee.git refs/heads/main | cut -f1)"
          SHORT_SHA="${SHA:0:12}"
          TAG="yattee-main-${SHORT_SHA}"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Upstream: $SHA"
          echo "Release tag: $TAG"

      - name: Check whether we already built it
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already built."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream commit."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.needs_build == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout upstream Yattee
        uses: actions/checkout@v4
        with:
          repository: yattee/yattee
          ref: ${{ needs.check.outputs.sha }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -scheme Yattee \
            -resolvePackageDependencies

      - name: Build unsigned tvOS app
        run: |
          xcodebuild \
            -scheme Yattee \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$RUNNER_TEMP/YatteeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/YatteeDerivedData/Build/Products/Release-appletvos/Yattee.app"

          test -d "$APP"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/Yattee.app"

          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Yattee-tvOS-sideload.ipa" Payload

          ls -lh "$GITHUB_WORKSPACE/Yattee-tvOS-sideload.ipa"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
        run: |
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/Yattee-tvOS-sideload.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Yattee tvOS $SHORT_SHA" \
            --notes "Automated unsigned tvOS build from yattee/yattee main commit $SHORT_SHA."

