name: Build QuietPlay Server

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QuietPlay
        uses: actions/checkout@v4
        with:
          repository: adampickering/quietplay
          ref: main

      - name: Create container Dockerfile
        run: |
          cat > Dockerfile.server <<'EOF'
          FROM node:20-bookworm-slim

          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                python3 \
                python3-pip \
                ffmpeg \
                ca-certificates \
                curl && \
              python3 -m pip install \
                --break-system-packages \
                --no-cache-dir \
                --upgrade yt-dlp && \
              rm -rf /var/lib/apt/lists/*

          WORKDIR /app

          COPY . .

          RUN npm ci

          ENV NODE_ENV=production

          EXPOSE 8787

          CMD ["npm", "run", "-w", "@quietplay/server", "dev"]
          EOF

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ghcr.io/hvg2k15/quietplay-server:main
